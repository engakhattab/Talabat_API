name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/Talabat/Talabat.slnx

      - name: Build
        run: dotnet build src/Talabat/Talabat.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test src/Talabat/Talabat.slnx --no-build --configuration Release --verbosity normal

      - name: Check vulnerable packages
        run: dotnet list src/Talabat/Talabat.slnx package --vulnerable --include-transitive
